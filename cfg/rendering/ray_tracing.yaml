renderer:
  renderer: "RayTracedLighting"
  headless: False
  # Render quality. Only affects the CAMERA/viewport image, NOT the LiDAR
  # (geometry-only depth) or SLAM. Cut to 4/2/1/1 during the GPU-contention era;
  # restored to a moderate real-time level 16/4 (2026-06-03) now that GLIM moved
  # to CPU and the camera is back on for the UI (GPU has headroom: ~6.1GB/44%).
  # Original Isaac defaults were 32/6/6/4 (offline-render overkill). Reconsider
  # later if the UI camera feed needs more (raise SPP) or for max GPU headroom on
  # large/multi-robot scenes (lower SPP). specular/volume kept low (lunar scene
  # has no glass/volumetrics) but must stay > 0 (Isaac AssertionError otherwise).
  samples_per_pixel_per_frame: 16
  max_bounces: 4
  max_specular_transmission_bounces: 1
  max_volume_bounces: 1
  subdiv_refinement_level: 0

lens_flares:
  enable: False
  scale: 0.5
  blades: 9
  aperture_rotation: 0.0
  sensor_diagonal: 28.0
  sensor_aspect_ratio: 1.5
  fstop: 2.8
  focal_length: 12.0

motion_blur:
  enable: False
  max_blur_diameter_fraction: 0.02
  exposure_fraction: 1.0
  num_samples: 8

chromatic_aberration:
  enable: False
  strength: [-0.055, -0.075, 0.015]
  model: ["Radial", "Radial", "Radial"]